<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- An earbud on its side, its stem and head a switch's track and knob.
       ./icon.sh renders it into Resources/AppIcon.icns and Assets/icon.png. -->
  <defs>
    <!-- macOS's icon grid: an 824 px squircle with continuous corners, 100 px in from each edge. -->
    <path id="squircle" d="M383.41,100.00 L640.59,100.00 C722.19,100.00 763.00,100.00 799.79,112.14 L806.92,113.89 C854.88,131.34 892.66,169.12 910.11,217.08 C924.00,261.00 924.00,301.81 924.00,383.41 L924.00,640.59 C924.00,722.19 924.00,763.00 911.86,799.79 L910.11,806.92 C892.66,854.88 854.88,892.66 806.92,910.11 C763.00,924.00 722.19,924.00 640.59,924.00 L383.41,924.00 C301.81,924.00 261.00,924.00 224.21,911.86 L217.08,910.11 C169.12,892.66 131.34,854.88 113.89,806.92 C100.00,763.00 100.00,722.19 100.00,640.59 L100.00,383.41 C100.00,301.81 100.00,261.00 112.14,224.21 L113.89,217.08 C131.34,169.12 169.12,131.34 217.08,113.89 C261.00,100.00 301.81,100.00 383.41,100.00 Z"/>
    <clipPath id="inside"><use href="#squircle"/></clipPath>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2E45"/><stop offset="1" stop-color="#161928"/>
    </linearGradient>
    <radialGradient id="light" cx=".25" cy=".1" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FE384"/><stop offset="1" stop-color="#10BFB0"/>
    </linearGradient>
    <linearGradient id="trackShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".5" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F2F4F7"/><stop offset="1" stop-color="#CDD2DC"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4E8EE"/><stop offset="1" stop-color="#A8B1C0"/>
    </linearGradient>
    <radialGradient id="gloss">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dy="10" stdDeviation="12" flood-opacity=".28"/>
    </filter>
    <filter id="budShadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dy="18" stdDeviation="22" flood-opacity=".38"/>
    </filter>
  </defs>
  <use href="#squircle" fill="url(#night)" filter="url(#iconShadow)"/>
  <g clip-path="url(#inside)">
    <use href="#squircle" fill="url(#light)"/>
    <rect x="172" y="396" width="553.8" height="232" rx="116" fill="url(#track)"/>
    <rect x="172" y="396" width="553.8" height="232" rx="116" fill="url(#trackShade)"/>
    <g filter="url(#budShadow)">
      <ellipse cx="731.0" cy="417.7" rx="57.7" ry="78" transform="rotate(-46 731.0 417.7)" fill="url(#tip)"/>
      <path d="M288,430 L493.5,430 A26,26 0 0 0 514.4,419.4 A156,156 0 1 1 514.4,604.6 A26,26 0 0 0 493.5,594 L288,594 A82,82 0 0 1 288,430 Z" fill="url(#bud)"/>
    </g>
    <ellipse cx="596" cy="442" rx="70" ry="40" transform="rotate(-24 596 442)" fill="url(#gloss)"/>
    <rect x="224" y="479.2" width="15" height="65.6" rx="7.5" fill="#A9B1BF"/>
    <use href="#squircle" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="6"/>
  </g>
</svg>
